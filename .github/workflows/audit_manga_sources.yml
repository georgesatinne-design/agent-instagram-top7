name: Diagnostic manga et couvertures V5 (sans publication)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  verifier_et_preparer_manga:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les bibliotheques gratuites
        run: python -m pip install -r requirements.txt
      - name: Tester tous les modules manga
        run: python -m unittest discover -s tests -p 'test_*manga*.py' -v
      - name: Diagnostiquer les sources de ventes
        run: python audit_manga_sources.py
      - name: Verifier la coherence des sept candidats
        run: python verifier_manga.py
      - name: Enqueter sur les sources complementaires
        run: python enquete_manga_v3.py
      - name: Generer huit images de MAQUETTE, sans publication
        run: python maquette_manga_v4.py
      - name: Retrouver les editions exactes et les couvertures (toujours aucune publication)
        run: python enrichissement_manga_v5.py
      - name: Telecharger les rapports et les maquettes (aucun appel Buffer)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-et-maquette-manga
          path: rapports_manga/
          if-no-files-found: warn
          retention-days: 14
