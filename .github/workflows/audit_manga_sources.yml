name: Diagnostic, verification et enquete sources manga (sans publication)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  verifier_sources_manga:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les bibliotheques gratuites
        run: python -m pip install requests beautifulsoup4
      - name: Tester les diagnostics manga
        run: python -m unittest discover -s tests -p 'test_*manga*.py' -v
      - name: Examiner les sources initiales
        run: python audit_manga_sources.py
      - name: Verification de coherence V2
        run: python verifier_manga.py
      - name: Enquete croisee sur les sources V3
        run: python enquete_manga_v3.py
      - name: Enregistrer les rapports uniquement (aucun envoi Buffer)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-sources-manga
          path: rapports_manga/
          if-no-files-found: warn
          retention-days: 14
