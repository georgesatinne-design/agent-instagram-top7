name: Diagnostic automatique des sources manga (sans publication)

on:
  workflow_dispatch:
  schedule:
    # Quatre contrôles par jour ; les workflows GitHub programmés peuvent être retardés.
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  verifier_sources_manga:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les bibliothèques gratuites
        run: python -m pip install requests beautifulsoup4
      - name: Tester le diagnostic avec des pages simulées
        run: python -m unittest discover -s tests -p 'test_audit_manga_sources.py' -v
      - name: Vérifier les sources publiques de classements
        run: python audit_manga_sources.py
      - name: Garder le rapport (aucune publication Instagram)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-sources-manga
          path: rapports_manga/
          if-no-files-found: warn
          retention-days: 14
