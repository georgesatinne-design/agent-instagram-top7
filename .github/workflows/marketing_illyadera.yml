name: Marketing Illyadera - analyse des performances réelles
on:
  push:
    branches: [main]
    paths: ['marketing_illyadera.py', '.github/workflows/marketing_illyadera.yml']
  workflow_dispatch:
  schedule:
    - cron: '13 7 * * 1'
      timezone: 'Europe/Paris'
permissions:
  contents: write
concurrency:
  group: illyadera-buffer-operations
  cancel-in-progress: false
jobs:
  marketing:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
      BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_marketing_illyadera.py' -v
      - name: Analyser les résultats sans modifier Buffer
        run: |
          python marketing_illyadera.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add marketing_state/strategie.json
          if ! git diff --cached --quiet; then
            git commit -m 'Marketing - stratégie hebdomadaire fondée sur les mesures disponibles'
            git push origin HEAD:main
          fi
