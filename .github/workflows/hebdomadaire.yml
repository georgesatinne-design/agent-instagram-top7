name: Agent Top 7 BD - surveillance et Queue automatiques

on:
  schedule:
    # Contrôle toutes les heures, à :23, en heure de Paris.
    # Seule une nouvelle période de ventes déclenche la fabrication et l'envoi.
    - cron: '23 * * * *'
      timezone: 'Europe/Paris'
  workflow_dispatch:

concurrency:
  group: surveillance-bd-buffer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  surveiller_et_programmer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Vérifier si la source possède un nouveau classement BD
        id: source
        run: python surveillance_bd.py --output sorties/snapshot_bd_verifie.json

      - name: Tester l'agent uniquement si un nouveau classement existe
        if: steps.source.outputs.new == 'true'
        run: python -m unittest discover -s tests -v

      - name: Produire le Top 7 depuis le classement vérifié
        if: steps.source.outputs.new == 'true'
        run: python agent.py --sortie sorties/hebdomadaire --snapshot-auto sorties/snapshot_bd_verifie.json

      - name: Vérifier le dossier, la légende et préparer les images publiques
        if: steps.source.outputs.new == 'true'
        env:
          EDITION: ${{ steps.source.outputs.edition }}
          SIGNATURE: ${{ steps.source.outputs.signature }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          python - <<'PY'
          import json,os,re,shutil
          from pathlib import Path
          root=Path('sorties/hebdomadaire')
          folder=root/'BD'
          report=json.loads((root/'rapport.json').read_text(encoding='utf-8'))
          if not any(d.get('categorie')=='BD' and d.get('diapositives')==8 and d.get('couvertures')==7 for d in report.get('dossiers',[])):
              raise SystemExit('Top 7 BD incomplet : dépôt automatique refusé (une nouvelle tentative aura lieu à la prochaine surveillance).')
          manifest=json.loads((folder/'post_manifest.json').read_text(encoding='utf-8'))
          if manifest.get('category')!='BD' or not manifest.get('ready_to_stage'):
              raise SystemExit('Carrousel non prêt : dépôt Buffer refusé.')
          if len(manifest.get('pages',[]))!=8:
              raise SystemExit('Huit pages sont obligatoires.')
          caption=(folder/'legende_instagram.txt').read_text(encoding='utf-8')
          if re.search(r'\b(source|sources|GfK|BDZoom|Edistat|Livres Hebdo)\b|https?://',caption,re.I):
              raise SystemExit('Sources détectées dans la légende : dépôt refusé.')
          if os.environ['REPO_PRIVATE']=='true':
              raise SystemExit('Les images doivent être accessibles à Buffer via un dépôt public.')
          target=Path('public_media')/os.environ['EDITION']/'BD'
          target.mkdir(parents=True,exist_ok=True)
          for name in manifest['pages']:
              shutil.copy2(folder/name,target/name)
          (root/'edition.json').write_text(json.dumps({'edition':os.environ['EDITION'],'signature':os.environ['SIGNATURE']}),encoding='utf-8')
          print('Carrousel complet, images préparées, sans sources dans la légende.')
          PY

      - name: Héberger les huit images du nouveau classement
        if: steps.source.outputs.new == 'true'
        run: |
          if [ -n "$(git status --porcelain public_media)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public_media
            git commit -m "Top 7 BD - médias du nouveau classement"
            git push origin HEAD:main
          fi

      - name: Vérifier la disponibilité publique des images avant toute réservation
        if: steps.source.outputs.new == 'true'
        env:
          EDITION: ${{ steps.source.outputs.edition }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,time
          import requests
          edition=os.environ['EDITION'];repo=os.environ['GITHUB_REPOSITORY']
          base=f'https://raw.githubusercontent.com/{repo}/main/public_media/{edition}/BD/'
          for attempt in range(1,7):
              not_ready=[]
              for i in range(1,9):
                  name=f'{i:02d}_rang_{8-i}.png' if i<8 else '08_recapitulatif.png'
                  try:
                      r=requests.get(base+name,timeout=15,stream=True)
                      good=r.ok and r.headers.get('Content-Type','').lower().startswith('image/')
                      r.close()
                  except requests.RequestException:
                      good=False
                  if not good: not_ready.append(name)
              if not not_ready:
                  print('Huit images publiques disponibles pour Buffer.');break
              print(f'Tentative {attempt}: images encore indisponibles :',not_ready)
              if attempt==6:raise SystemExit('Images publiques non disponibles. Aucun appel Buffer effectué; le prochain contrôle pourra réessayer.')
              time.sleep(8)
          PY

      - name: Vérifier les accès Buffer AVANT de réserver l'édition
        if: steps.source.outputs.new == 'true'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: |
          if [ -z "$BUFFER_API_KEY" ] || [ -z "$BUFFER_CHANNEL_ID" ]; then
            echo "Accès Buffer absents : aucune réservation, nouvelle tentative au prochain contrôle."
            exit 1
          fi

      - name: Réserver cette édition AVANT l'appel à Buffer (anti-doublon)
        if: steps.source.outputs.new == 'true'
        env:
          EDITION: ${{ steps.source.outputs.edition }}
          SIGNATURE: ${{ steps.source.outputs.signature }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          receipt=Path('buffer_receipts')/(os.environ['EDITION']+'.json')
          if receipt.exists():
              raise SystemExit('Édition déjà enregistrée. Appel à Buffer refusé pour éviter un doublon.')
          receipt.parent.mkdir(parents=True,exist_ok=True)
          receipt.write_text(json.dumps({
              'statut':'RESERVATION_AVANT_ENVOI',
              'edition':os.environ['EDITION'],
              'empreinte_classement':os.environ['SIGNATURE'],
              'run_id':os.environ['RUN_ID'],
              'note':'Si le run échoue à cette étape, vérifier la Queue avant de supprimer la réservation.'
          },ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add buffer_receipts
          git commit -m "Top 7 BD - réservation anti-doublon avant programmation"
          git push origin HEAD:main

      - name: Envoyer automatiquement le carrousel dans la Queue Buffer
        if: steps.source.outputs.new == 'true'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EDITION: ${{ steps.source.outputs.edition }}
          SIGNATURE: ${{ steps.source.outputs.signature }}
        run: |
          if [ -z "$BUFFER_API_KEY" ] || [ -z "$BUFFER_CHANNEL_ID" ]; then
            echo "Clé Buffer ou identifiant du canal manquant. Aucune publication effectuée."
            exit 1
          fi
          BASE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/public_media/${EDITION}/BD/"
          python buffer_client.py --send --folder sorties/hebdomadaire/BD --public-base-url "$BASE_URL"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('sorties/hebdomadaire/BD/RECU_BUFFER.json').read_text(encoding='utf-8'))
          if r.get('statut')!='POST_PROGRAMME':raise RuntimeError('Buffer ne confirme pas une programmation.')
          r['edition']=os.environ['EDITION']
          r['empreinte_classement']=os.environ['SIGNATURE']
          p=Path('buffer_receipts')/(os.environ['EDITION']+'.json')
          p.write_text(json.dumps(r,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git add buffer_receipts
          git commit -m "Top 7 BD - reçu de programmation automatique Buffer"
          git push origin HEAD:main

      - name: Livrer le dossier BD et le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dossier-bd-automatique
          path: sorties/hebdomadaire/
          if-no-files-found: ignore
          retention-days: 30
