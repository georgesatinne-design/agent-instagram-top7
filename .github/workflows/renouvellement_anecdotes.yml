name: Renouvellement des sujets anecdotes - Buffer
on:
  push:
    branches: [main]
    paths:
      - 'anecdotes_auto/renouvellement.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: illyadera-buffer-operations
  cancel-in-progress: false
jobs:
  renouvellement:
    if: github.ref == 'refs/heads/main' && vars.ILLYADERA_PAUSE_PUBLICATION != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Préparer tous les sujets inédits
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m anecdotes_auto.renouvellement prepare
          git add anecdotes_state public_media/anecdotes_bd
          if ! git diff --cached --quiet; then
            git commit -m 'Six nouveaux sujets - médias et preuves'
            git push origin HEAD:main
          fi
      - name: Remplacer chaque ancien sujet et relire Buffer
        env:
          ILLYADERA_DURABLE_JOURNAL: '1'
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
        run: python -m anecdotes_auto.renouvellement send
