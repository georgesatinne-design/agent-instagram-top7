name: Buffer - audit et réconciliation automatiques (aucune mutation Buffer)
on:
  workflow_dispatch:
  schedule:
    - cron: '11 5,13,21 * * *'
      timezone: 'Europe/Paris'
  push:
    branches: [main]
    paths:
      - 'reconciliation_auto.py'
      - '.github/workflows/audit_buffer_lecture_seule.yml'
permissions:
  contents: write
concurrency:
  group: illyadera-buffer-operations
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Réconcilier les reçus depuis la file en lecture seule
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
        run: python reconciliation_auto.py
      - name: Enregistrer uniquement les reçus et intentions réconciliés
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for p in anecdotes_state/programmes.json anecdotes_state/intentions_tops.json buffer_receipts manga_buffer_receipts comics_buffer_receipts; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Réconciliation automatique Buffer (lecture seule)'
            git push origin HEAD:main
          fi
