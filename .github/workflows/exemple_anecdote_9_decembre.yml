name: Exemple anecdote - 9 décembre uniquement
on:
  push:
    branches: [main]
    paths:
      - 'anecdotes_auto/exemple_9_decembre.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: illyadera-buffer-operations
  cancel-in-progress: false
jobs:
  exemple:
    if: github.ref == 'refs/heads/main' && vars.ILLYADERA_PAUSE_PUBLICATION != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Créer le carrousel avec les archives vérifiées
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
        run: python -m anecdotes_auto.exemple_9_decembre prepare
      - name: Héberger les cinq images avant remplacement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- anecdotes_state public_media/anecdotes_bd/2026-12-09
          if ! git diff --cached --quiet; then
            git commit -m 'Exemple du 9 décembre - archives et médias'
            git push origin HEAD:main
          fi
      - name: Remplacer seulement cette anecdote dans Buffer
        env:
          ILLYADERA_DURABLE_JOURNAL: '1'
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
        run: python -m anecdotes_auto.exemple_9_decembre send
