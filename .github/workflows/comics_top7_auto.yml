name: Comics - TOP 5 hebdomadaire + TOP 7 mensuel vers Buffer

on:
  workflow_dispatch:
  schedule:
    # Vérifie les classements dès leur disponibilité, sans attendre le jour Instagram.
    - cron: '27 8,14,20 * * *'
      timezone: 'Europe/Paris'

permissions:
  contents: write

concurrency:
  group: illyadera-buffer-operations
  cancel-in-progress: false

jobs:
  comics:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Préparer Git pour les deux historiques comics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances du projet
        run: python -m pip install -r requirements.txt
      - name: Tester l'agent comics sans envoyer de post
        run: python -m unittest discover -s tests -p 'test_comics_periodiques.py' -v
      - name: Vérifier séparément les deux classements et produire les visuels
        env:
          ILLYADERA_MULTI_COVER_ON: '1'
        run: |
          python comics_pipeline_periodique.py --cadence TOUS \
            --sortie sorties/comics_periodique --historique comics_history
      - name: Préparer les médias HTTPS avant de contacter Buffer
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          python comics_deployer_periodique.py prepare --repo "$GITHUB_REPOSITORY"
          if [ -d public_media ]; then git add public_media; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Comics - visuels hebdo et mensuels vérifiés'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Préparer une place pour chaque Top comics complet
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          ILLYADERA_TOP_VERIFIED: 'true'
        run: |
          python -m unittest discover -s tests -p 'test_illyadera_queue.py' -q
          if python -c 'import json,sys; from pathlib import Path; p=Path("sorties/comics_periodique/PLAN_BUFFER.json"); plan=json.loads(p.read_text()); assert isinstance(plan,list); sys.exit(0 if plan else 3)'; then
            python -m illyadera_queue before-top --kind COMICS
          else
            code=$?
            if [ "$code" -ne 3 ]; then exit "$code"; fi
            mkdir -p sorties/queue_illyadera
            echo '{"kind":"COMICS","slots":[],"actions":[]}' > sorties/queue_illyadera/ARBITRAGE_TOP.json
            echo 'Aucun classement prêt : aucun arbitrage Buffer.'
          fi
          if [ -d anecdotes_state ] && [ -n "$(git status --porcelain anecdotes_state)" ]; then
            git add anecdotes_state
            git commit -m 'Queue Illyadera - place aux classements comics'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Programmer dès disponibilité dans Buffer
        env:
          ILLYADERA_SLOT_PLAN: sorties/queue_illyadera/ARBITRAGE_TOP.json
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
        run: |
          python comics_deployer_periodique.py send
      - name: Enregistrer seulement les reçus et historiques comics
        if: always()
        run: |
          if [ -d comics_buffer_receipts ]; then git add comics_buffer_receipts; fi
          if [ -d comics_history ]; then git add comics_history; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Comics - reçus Buffer et classements historisés'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Conserver les rapports et carrousels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dossier-comics-hebdo-mensuel
          path: sorties/comics_periodique/
          retention-days: 1
          if-no-files-found: warn
