name: Réel hebdomadaire - anecdote du mercredi
on:
  push:
    branches: [main]
    paths: ['reels_illyadera.py', '.github/workflows/reels_illyadera.yml']
  workflow_dispatch:
  schedule:
    - cron: '7 11 * * *'
      timezone: 'Europe/Paris'
    - cron: '5 14 * * 3'
      timezone: 'Europe/Paris'
permissions:
  contents: write
concurrency:
  group: illyadera-buffer-operations
  cancel-in-progress: false
jobs:
  reel:
    if: github.ref == 'refs/heads/main' && vars.ILLYADERA_PAUSE_PUBLICATION != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
      BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
      ILLYADERA_DURABLE_JOURNAL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core
      - name: Tester la sélection, le cadrage et la voix
        run: python -m unittest discover -s tests -p 'test_reels_illyadera.py' -v
      - name: Produire la vidéo originale du mercredi
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python reels_illyadera.py prepare
          if [ -d public_media/reels_illyadera ]; then git add public_media/reels_illyadera; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Réel du mercredi - vidéo MP4 contrôlée'
            git push origin HEAD:main
          fi
      - name: Convertir le post sans supprimer ni doubler et relire Buffer
        run: python reels_illyadera.py send
